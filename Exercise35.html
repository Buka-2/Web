<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Object Manipulation</title>
    <style>
        body { font-family: monospace; line-height: 1.5; padding: 20px; color: #000; background: #fff; }
        .section { margin-bottom: 30px; }
        .title { font-weight: bold; margin-bottom: 10px; display: block; }
        pre { margin: 0; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="section">
        <span class="title">1. Original Properties & Values:</span>
        <div id="original-display"></div>
    </div>

    <hr>

    <div class="section">
        <span class="title">2. Object after deleting 'age':</span>
        <pre id="deleted-display"></pre>
    </div>

    <script>
        // 原始物件
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // 1. 顯示原始所有屬性與值 (僅保留 Key: Value)
        var originalDiv = document.getElementById('original-display');
        var content = "";
        for (var key in Person) {
            content += key + ": " + Person[key] + "<br>";
        }
        originalDiv.innerHTML = content;

        // 2. 刪除 age 屬性
        delete Person.age;

        // 3. 顯示刪除後的物件 (純文字格式)
        document.getElementById('deleted-display').textContent = JSON.stringify(Person, null, 4);
    </script>

</body>
</html>
