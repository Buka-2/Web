<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Object Property Manipulation</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .section { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>JavaScript Object Manipulation</h2>

    <div class="section">
        <strong>1. Original Properties:</strong>
        <pre id="original-props"></pre>
    </div>

    <div class="section">
        <strong>2. Object After Deleting 'age':</strong>
        <pre id="final-object"></pre>
    </div>

    <script>
        // Sample object from image_3b2b19.png
        var Person = {
            firstName : "Tony",
            lastName : "Lee",
            age : 50,
            eyeColor : "Blue"
        };

        // 1. List all properties
        var properties = Object.keys(Person).join(", ");
        document.getElementById('original-props').textContent = properties;

        // 2. Delete the age property
        delete Person.age;

        // 3. Print the object after deleting the property
        // Using JSON.stringify for a readable string format
        document.getElementById('final-object').textContent = JSON.stringify(Person, null, 4);
        
        // Log to console as requested by "print the object"
        console.log("Updated Person Object:", Person);
    </script>
</body>
</html>
