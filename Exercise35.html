<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Object Property Manipulation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; padding: 20px; color: #333; }
        pre { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; overflow-x: auto; }
        .section { margin-bottom: 30px; }
        .label { font-weight: bold; color: #0056b3; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>JavaScript Object Manipulation</h2>

    <div class="section">
        <span class="label">1. List of All Original Properties:</span>
        <!-- 使用 div 來接收換行後的屬性清單 -->
        <div id="original-props-list" style="background: #f0f7ff; padding: 10px; border-left: 5px solid #0056b3;"></div>
    </div>

    <div class="section">
        <span class="label">2. Object Content After Deleting 'age':</span>
        <pre id="final-object-display"></pre>
    </div>

    <script>
        // 來自 image_3b2b19.png 的範例物件
        var Person = {
            firstName : "Tony",
            lastName : "Lee",
            age : 50,
            eyeColor : "Blue"
        };

        // --- 步驟 1: 列出所有屬性並換行 ---
        var allKeys = Object.keys(Person);
        var listElement = document.getElementById('original-props-list');
        
        // 使用 join('<br>') 確保在網頁上每一項都換行顯示
        listElement.innerHTML = allKeys.join('<br>');

        // --- 步驟 2: 刪除 age 屬性 ---
        delete Person.age;

        // --- 步驟 3: 顯示刪除後的物件狀態 ---
        // JSON.stringify 的第三個參數 '4' 代表縮排空格數，確保顯示格式漂亮
        document.getElementById('final-object-display').textContent = JSON.stringify(Person, null, 4);
        
        // 同時輸出至控制台供檢查
        console.log("Final Person Object:", Person);
    </script>
</body>
</html>
